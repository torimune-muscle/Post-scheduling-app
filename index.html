<style>
  :root{
    --bg:#f6f4ef; --card:#fff; --ink:#2b2a28; --sub:#77736b; --line:#e7e2d8; --field:#fcfbf8;
    --accent:#c9486c; --accent-soft:#fbe5ec; --accent2:#f2a65a;
    --draft:#b7791f; --draft-soft:#fdf3e1;
    --reel:#6b4ec9; --reel-soft:#ece7fb;
    --sun:#c94a4a; --sat:#3f6fb8;
    --radius:18px; --shadow:0 6px 24px rgba(40,30,20,.07);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#1b1a19; --card:#262523; --ink:#f1eee8; --sub:#a39e95; --line:#3a3835; --field:#2e2d2a;
      --accent:#e6749a; --accent-soft:#4a2633; --draft:#e0b25a; --draft-soft:#3d3222;
      --reel:#a78bfa; --reel-soft:#302a49;
      --sun:#ec8a8a; --sat:#8fb0ea; --shadow:0 6px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  button,select,input{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
  .wrap{max-width:1080px;margin:0 auto;padding:24px 16px 120px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
  h1{font-size:20px;margin:0;display:flex;align-items:center;gap:10px}
  h1 .logo{width:34px;height:34px;object-fit:contain;display:block}
  .hactions{display:flex;gap:8px}
  .btn{min-height:44px;padding:0 18px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:500;transition:.15s;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:inherit}
  .btn:hover{border-color:var(--ink)}
  .btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .btn.accent{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}

  /* month */
  .nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .nav .month{font-size:26px;font-weight:700;min-width:120px;text-align:center}
  .nav .month small{display:block;font-size:13px;color:var(--sub);font-weight:500}
  .nav .jump{display:flex;gap:6px;margin-left:auto}
  select,input[type=text],input[type=number]{padding:0 10px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--field)}
  .icon{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:20px}
  .icon:disabled{opacity:.3;cursor:not-allowed}
  .progress{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:13px;color:var(--sub);flex-wrap:wrap}
  .bar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden;max-width:260px}
  .bar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .4s}
  .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
  .dow{text-align:center;font-size:12px;color:var(--sub);padding-bottom:2px;font-weight:700}
  .dow.sun{color:var(--sun)}.dow.sat{color:var(--sat)}
  .day{min-height:100px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:8px;display:flex;flex-direction:column;gap:5px;transition:transform .15s,box-shadow .15s;text-decoration:none;color:inherit}
  .day:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--sub)}
  .day.empty{border:0;background:transparent;pointer-events:none}
  .day.past:not(.done):not(.draft){opacity:.55}
  .day .top{display:flex;justify-content:space-between;align-items:center}
  .day .num{font-weight:700;font-size:14px;width:26px;height:26px;display:grid;place-items:center;border-radius:99px;margin:-3px}
  .day.sun .num{color:var(--sun)}.day.sat .num{color:var(--sat)}
  .day.today .num{background:var(--ink);color:var(--bg)}
  .day .dot{width:9px;height:9px;border-radius:99px}
  .day.done{background:var(--accent-soft);border-color:var(--accent)}
  .day.done .dot{background:var(--accent)}
  .day.done.reel{background:var(--reel-soft);border-color:var(--reel)}
  .day.done.reel .dot{background:var(--reel)}
  .day.draft{background:var(--draft-soft);border-color:var(--draft);border-style:dashed}
  .day.draft .dot{background:var(--draft)}
  .day .badge{align-self:flex-start;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700;color:#fff;background:var(--accent)}
  .day.reel .badge{background:var(--reel)}
  .day.draft .badge{background:var(--draft)}
  .day .preview{font-size:11px;color:var(--sub);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
  .day{cursor:pointer}
  .day .shoot{display:block;font-size:11px;font-weight:700;color:var(--sat);background:var(--card);border:1px solid var(--sat);border-radius:8px;padding:2px 6px;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .day .shoot:hover{background:var(--sat);color:#fff}
  .shoot-info{display:flex;flex-direction:column;align-items:center;gap:6px;margin:-12px 0 20px;font-size:13px;font-weight:700}
  .shoot-info a,.shoot-info span{color:var(--sat);text-decoration:none;padding:6px 12px;border:1px solid var(--sat);border-radius:999px}
  .shoot-info a:hover{background:var(--sat);color:#fff}
  .legend{display:flex;gap:18px;margin-top:16px;font-size:12px;color:var(--sub);flex-wrap:wrap}
  .legend i{display:inline-block;width:14px;height:14px;border-radius:5px;vertical-align:-2px;margin-right:6px}
  .hint{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--field);color:var(--sub);font-size:13px}

  /* editor */
  .editor-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .editor-head .date{font-size:22px;font-weight:700;flex:1;text-align:center;min-width:180px}
  .status{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--sub);margin-bottom:22px;min-height:18px;flex-wrap:wrap}
  .status .pill{padding:2px 10px;border-radius:99px;font-weight:700;color:#fff}
  .status .pill.done{background:var(--accent)}.status .pill.draft{background:var(--draft)}.status .pill.none{background:var(--sub)}
  label.lbl{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;margin-bottom:8px;font-size:14px;gap:8px}
  label.lbl small{font-weight:400;color:var(--sub)}
  textarea{width:100%;font:inherit;line-height:1.6;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--field);color:var(--ink);resize:none;overflow:hidden;outline:none;transition:border-color .15s,box-shadow .15s;min-height:84px}
  textarea:focus,input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
  textarea::placeholder,input::placeholder{color:var(--sub);opacity:.7}
  input[type=text],input[type=number],select{width:100%}
  .section{margin-bottom:26px}
  .section > h3{font-size:15px;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .field label{display:block;font-size:12px;color:var(--sub);font-weight:700;margin-bottom:5px}
  .unit{position:relative}
  .unit input{padding-right:46px}
  .unit .u{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:12px;pointer-events:none}
  .slides{display:grid;gap:12px}
  .slide{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card);display:grid;grid-template-columns:52px 1fr;gap:12px;animation:pop .2s ease}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}}
  .slide .no{aspect-ratio:9/16;border-radius:10px;background:linear-gradient(160deg,var(--accent),var(--accent2));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;line-height:1.1}
  .slide .no b{font-size:18px}.slide .no span{font-size:10px;opacity:.9}
  .slide .tools{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:6px}
  .slide .count{font-size:11px;color:var(--sub)}
  .mini{min-width:36px;height:36px;padding:0 10px;border-radius:999px;border:1px solid var(--line);color:var(--sub);font-size:13px}
  .mini:hover:not(:disabled){color:var(--ink);border-color:var(--ink)}
  .mini.danger:hover:not(:disabled){color:#fff;background:var(--sun);border-color:var(--sun)}
  .mini:disabled{opacity:.3;cursor:not-allowed}
  .add{margin-top:12px;width:100%;min-height:56px;border:2px dashed var(--line);border-radius:14px;color:var(--sub);font-weight:700}
  .add:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .add:disabled{cursor:not-allowed}
  /* ingredients */
  .day-tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:24px}
  .ing-head,.ing-row{display:grid;grid-template-columns:1fr 110px 90px 40px;gap:8px;align-items:center}
  .ing-head{font-size:11px;color:var(--sub);font-weight:700;margin-bottom:6px;padding:0 2px}
  .ing-row{margin-bottom:8px}
  .ing-unit{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ing-unit.miss{color:var(--draft)}
  .switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:10px;cursor:pointer}
  .switch input{width:18px;height:18px;accent-color:var(--accent)}
  .nut-note{font-size:12px;color:var(--sub);margin-bottom:12px;line-height:1.6}
  .nut-note.warn-note{color:var(--draft);font-weight:700}
  /* food db page */
  .tabs{display:flex;gap:8px;margin-bottom:20px}
  .tab{flex:1;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;color:var(--sub)}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
  .total{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--field);text-align:center}
  .total .tl{display:block;font-size:12px;color:var(--sub);font-weight:700}
  .total b{font-size:26px;color:var(--accent)}
  .total .tu{font-size:12px;color:var(--sub);margin-left:2px}
  .total small{display:block;font-size:11px;color:var(--sub);margin-top:2px}
  .db-list{max-height:460px;overflow:auto;border:1px solid var(--line);border-radius:14px}
  .db-item{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
  .db-item:last-child{border-bottom:0}
  .db-item small{display:block;font-size:11px;color:var(--sub)}
  .db-nums{font-size:12px;color:var(--sub);white-space:nowrap}
  .food-form{border:1px solid var(--accent);border-radius:14px;padding:14px;background:var(--field)}
  .refs{display:grid;gap:8px}
  .ref-row{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center}
  .ref-no{width:28px;height:28px;border-radius:99px;background:var(--line);color:var(--sub);font-size:12px;font-weight:700;display:grid;place-items:center}
  .ref-row input{width:100%;padding:0 12px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--field)}
  .ref-open{white-space:nowrap;background:var(--accent);color:#fff;border-color:var(--accent)}
  .ref-open[aria-disabled]{background:var(--card);color:var(--sub);border-color:var(--line);opacity:.45;pointer-events:none}
  /* caption */
  .caption-box{border:1px solid var(--line);border-radius:14px;background:var(--field);padding:14px;white-space:pre-wrap;font-size:13px;line-height:1.75;max-height:420px;overflow:auto;word-break:break-word}
  .caption-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .warn{background:var(--draft-soft);color:var(--draft);border-radius:10px;padding:10px 12px;font-size:12px;margin-bottom:10px;font-weight:700}

  /* toast & dialog */
  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-size:14px;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:.2s;box-shadow:var(--shadow);z-index:10;max-width:calc(100% - 32px)}
  .toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .toast button{color:var(--accent2);font-weight:700}
  dialog{border:0;border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);max-width:440px;width:calc(100% - 32px);background:var(--card);color:var(--ink)}
  dialog::backdrop{background:rgba(0,0,0,.4)}
  dialog h3{margin:0 0 6px}
  dialog p{margin:0 0 16px;color:var(--sub);font-size:13px}
  .choice{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer}
  .choice:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
  .choice input{accent-color:var(--accent);width:18px;height:18px;min-height:0}
  .choice small{display:block;color:var(--sub)}
  .dlg-foot{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:18px;flex-wrap:wrap}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  @media (max-width:640px){
    .card{padding:14px}
    .grid{gap:4px}
    .day{min-height:64px;padding:5px;border-radius:10px;gap:3px}
    .day .preview{display:none}
    .day .badge{font-size:10px;padding:0 5px}
    .nav .jump{margin-left:0;width:100%}
    .nav .jump select{flex:1}
    .editor-head .date{order:-1;width:100%;font-size:19px}
    .editor-head .btn{flex:1;justify-content:center}
    .ing-head{display:none}
    .ing-row{grid-template-columns:1fr 80px 60px 36px;gap:6px}
    .day-tools .btn{flex:1;justify-content:center;padding:0 10px}
    .db-item{grid-template-columns:1fr;gap:4px}
    .total b{font-size:22px}
    .hactions .btn span{display:none}
  }
</style>
</head>

const toHalf = s => String(s ?? '').replace(/[Ａ-Ｚａ-ｚ０-９．]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/　/g, ' ');
// DBの単位表記（例「100g」「大さじ1」「165（１個）」）を「基準量」と「単位名」に分解する
function parseUnit(u) {
  const s = toHalf(u).trim();
  const w = s.match(/(\d+(?:\.\d+)?)\s*(ml|g)/i);
  if (w) return { base: +w[1], label: w[2].toLowerCase() };
  const sp = s.match(/([大小])さじ\s*(\d+(?:\.\d+)?)?/);
  if (sp) return { base: +(sp[2] ?? 1), label: `${sp[1]}さじ` };
  const n = s.match(/(\d+(?:\.\d+)?)/);
  if (n) {
    const num = +n[1];
    // 「165（１個）」のように大きな数字だけのものはグラム表記とみなす
    if (num >= 20) return { base: num, label: 'g' };
    return { base: num, label: s.replace(/[\d.()（）\s]/g, '') || '個' };
  }
  return { base: 1, label: '個' };
}
// nutrition_calculator と同じ保存キー・同じ形でDBを持つ
const DB_KEY = 'nutritionDB';
const foodLabel = f => `${f.name}｜${f.unit}`;
let RAW_FOODS = [], FOODS = [], FOOD_BY_LABEL = new Map(), FOOD_BY_NAME = {};
function loadFoods() {
  let stored = null;
  try { stored = JSON.parse(localStorage.getItem(DB_KEY)); } catch {}
  RAW_FOODS = Array.isArray(stored) && stored.length ? stored : FOOD_DB.map(f => ({ ...f, type: 'ingredient' }));
  rebuildFoods();
}
function saveFoods() {
  try { localStorage.setItem(DB_KEY, JSON.stringify(RAW_FOODS)); } catch { toast('材料DBを保存できませんでした'); }
  rebuildFoods();
}
function rebuildFoods() {
  FOODS = RAW_FOODS.filter(f => f && f.name).map(f => ({ ...f, ...parseUnit(f.unit) }));
  FOOD_BY_LABEL = new Map(FOODS.map(f => [foodLabel(f), f]));
  FOOD_BY_NAME = FOODS.reduce((map, f) => { (map[f.name] ??= []).push(f); return map; }, {});
  const dl = document.getElementById('foodList');
  if (dl) dl.innerHTML = FOODS.map(f => `<option value="${esc(foodLabel(f))}">${esc(f.kcal)}kcal / P${esc(f.protein)} F${esc(f.fat)} C${esc(f.carb)}</option>`).join('');
}
const findFood = text => {
  const t = String(text ?? '').trim();
  if (!t) return null;
  if (FOOD_BY_LABEL.has(t)) return FOOD_BY_LABEL.get(t);
  const byName = FOOD_BY_NAME[t];
  return byName?.length === 1 ? byName[0] : (byName?.[0] ?? null);
};
const rowName = r => String(r?.name ?? '').split('｜')[0].trim();
// 材料の合計と1人前の栄養素を計算する
function calcNutrition(entry) {
  const rows = entry.ingredientRows ?? [];
  const total = { kcal: 0, protein: 0, fat: 0, carb: 0 };
  const unknown = [];
  let counted = 0;
  rows.forEach(r => {
    const name = rowName(r);
    if (!name) return;
    const food = findFood(r.name);
    const amount = parseFloat(toHalf(r.amount));
    if (!food || !(amount > 0)) { unknown.push(name); return; }
    const mult = amount / food.base;
    total.kcal += food.kcal * mult; total.protein += food.protein * mult;
    total.fat += food.fat * mult; total.carb += food.carb * mult;
    counted++;
  });
  const servings = parseFloat(toHalf(entry.servings)) || 0;
  const per = servings > 0 ? Object.fromEntries(Object.entries(total).map(([k, v]) => [k, Math.round(v / servings * 10) / 10])) : null;
  return { total, per, unknown, counted, servings };
}

        <button class="icon" id="prev" aria-label="前の月" ${ymIndex(view) <= ymIndex(MIN) ? 'disabled' : ''}>‹</button>
        <h2 class="month" aria-live="polite" style="margin:0"><small>${y}年</small>${m}月</h2>
        <button class="icon" id="next" aria-label="次の月" ${ymIndex(view) >= ymIndex(MAX) ? 'disabled' : ''}>›</button>
        <div class="jump">
          <select id="selY" aria-label="年">${years}</select>
          <select id="selM" aria-label="月">${months}</select>
          <button class="btn" id="todayBtn">今日</button>
        </div>
      </div>
      <div class="progress">
        <div class="bar" aria-hidden="true"><span style="width:${done / days * 100}%"></span></div>
        <span>投稿決定 <b style="color:var(--accent)">${done}</b>日（🖼${feed}・🎬${reel}）${draft ? `・入力途中 <b style="color:var(--draft)">${draft}</b>日` : ''}・未入力 ${days - done - draft}日</span>
      </div>
      <div class="grid" role="grid">
        ${DOW.map((w, i) => `<div class="dow ${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${w}</div>`).join('')}
        ${cells.join('')}
      </div>
      <div class="legend">
        <span><i style="background:var(--accent-soft);border:1px solid var(--accent)"></i>🖼 フィード</span>
        <span><i style="background:var(--reel-soft);border:1px solid var(--reel)"></i>🎬 リール</span>
        <span><i style="background:var(--draft-soft);border:1px dashed var(--draft)"></i>入力途中</span>
        <span><i style="background:var(--card);border:1px solid var(--line)"></i>未入力</span>
        <span><i style="background:var(--card);border:1px solid var(--sat)"></i>📷 撮影日（投稿の3日前・タップでレシピへ）</span>
      </div>
      ${Object.keys(data).length === 0 ? '<div class="hint">💡 日付をタップして、レシピ名・材料・作り方などを入力すると、キャプションが自動で作られます。入力は自動保存されます。</div>' : ''}
      <div class="legend" style="margin-top:8px">キーボード：← → で月を移動</div>
    </section>`;

  app.querySelectorAll('[data-go]').forEach(c => {
    const go = () => location.hash = `day/${c.dataset.go}`;
    c.onclick = e => { if (!e.target.closest('a')) go(); };
    c.onkeydown = e => { if (e.key === 'Enter' && e.target === c) go(); };
  });
  const shift = n => goMonth(clampYM(fromIndex(ymIndex(view) + n)));
  app.querySelector('#prev').onclick = () => shift(-1);
  app.querySelector('#next').onclick = () => shift(1);
  app.querySelector('#selY').onchange = e => goMonth(clampYM({ y: +e.target.value, m }));
  app.querySelector('#selM').onchange = e => goMonth({ y, m: +e.target.value });
  app.querySelector('#todayBtn').onclick = () => {
    const t = new Date();
    if (inRange(t.getFullYear(), t.getMonth() + 1, t.getDate())) location.hash = `day/${keyOf(t.getFullYear(), t.getMonth() + 1, t.getDate())}`;
    else goMonth(clampYM({ y: t.getFullYear(), m: t.getMonth() + 1 }));
  };
  const onKey = e => {
    if (e.target.closest('input,textarea,select') || document.querySelector('dialog[open]')) return;
    if (e.key === 'ArrowLeft') shift(-1);
    if (e.key === 'ArrowRight') shift(1);
  };
  addEventListener('keydown', onKey);
  cleanup = () => removeEventListener('keydown', onKey);
}

// ---------- 材料DB・計算ツールのページ ----------
let dbTab = 'calc';
let calcRows = [{ name: '', amount: '' }];
let calcServings = '1';
let dbQuery = '';
let dbEditId = null;

function renderFoodPage() {
  const nutRows = () => {
    const tmp = { ingredientRows: calcRows, servings: calcServings };
    return calcNutrition(tmp);
  };
  const res = nutRows();
  const list = FOODS.filter(f => !dbQuery || f.name.includes(dbQuery));

  app.innerHTML = `

      <div class="tabs">
        <button class="tab ${dbTab === 'calc' ? 'on' : ''}" data-tab="calc">🧮 計算する</button>
        <button class="tab ${dbTab === 'db' ? 'on' : ''}" data-tab="db">📋 DB管理（${FOODS.length}件）</button>
      </div>

      ${dbTab === 'calc' ? `
        <div class="section">
          <div class="ing-head"><span>材料名</span><span>分量</span><span>単位</span><span></span></div>
          <div id="calcRows">
            ${calcRows.map((r, i) => {
              const food = findFood(r.name);
              return `<div class="ing-row">
                <input type="text" list="foodList" data-cname="${i}" value="${esc(r.name)}" placeholder="材料名（例：鶏むね肉）">
                <input type="text" inputmode="decimal" data-camt="${i}" value="${esc(r.amount)}" placeholder="300">
                <span class="ing-unit ${food ? '' : 'miss'}">${esc(food?.label || '—')}${food ? '' : ' 未登録'}</span>
                <button class="mini danger" data-cdel="${i}" ${calcRows.length === 1 ? 'disabled' : ''}>×</button>
              </div>`;
            }).join('')}
          </div>
          <button class="add" id="calcAdd" style="min-height:48px">＋ 材料を追加</button>
        </div>
        <div class="section">
          <div class="fields" style="grid-template-columns:160px 1fr;align-items:end">
            <div class="field"><label for="calcServ">何人前で割る</label>
              <div class="unit"><input type="text" inputmode="decimal" id="calcServ" value="${esc(calcServings)}"><span class="u">人前</span></div></div>
            <div class="nut-note" style="margin:0 0 12px">${res.unknown.length ? `計算に含めていない材料：${esc(res.unknown.join('・'))}` : '材料名はDBの候補から選ぶと計算されます'}</div>
          </div>
          <div class="totals">
            ${[['カロリー', 'kcal', 'kcal'], ['タンパク質', 'protein', 'g'], ['脂質', 'fat', 'g'], ['糖質', 'carb', 'g']].map(([lbl, key, u]) => `
              <div class="total"><span class="tl">${lbl}</span>
                <b>${res.per ? res.per[key] : Math.round(res.total[key] * 10) / 10}</b><span class="tu">${u}</span>
                <small>全量 ${Math.round(res.total[key] * 10) / 10}${u}</small></div>`).join('')}
          </div>
          <div class="caption-actions">
            <button class="btn" id="calcClear">🧹 入力をクリア</button>
          </div>
        </div>
      ` : `
        <div class="section">
          <input type="text" id="dbSearch" value="${esc(dbQuery)}" placeholder="材料名で検索..." style="margin-bottom:12px">
          <div class="db-list">
            ${list.length ? list.map(f => dbEditId === f.id ? foodForm(f) : `
              <div class="db-item">
                <div><b>${esc(f.name)}</b><small>${esc(f.unit)}（${f.base}${esc(f.label)}あたり）</small></div>
                <div class="db-nums">${f.kcal}kcal ／ P${f.protein} F${f.fat} C${f.carb}</div>
                <div style="display:flex;gap:6px">
                  <button class="mini" data-edit="${f.id}">編集</button>
                  <button class="mini danger" data-del="${f.id}">削除</button>
                </div>
              </div>`).join('') : '<div class="nut-note">見つかりませんでした</div>'}
          </div>

        <div class="section">
          <h3>➕ 材料を追加</h3>
          ${foodForm(null)}

        <div class="section">
          <h3>🗂 DBのバックアップ</h3>
          <div class="caption-actions">
            <button class="btn" id="dbSave">💾 DBを書き出す</button>
            <button class="btn" id="dbLoad">📂 DBを読み込む</button>
            <button class="btn" id="dbReset">↩ 最初の210件に戻す</button>
          </div>
          <input type="file" id="dbFile" accept="application/json" class="sr">
        </div>
      `}
    </section>`;

  app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { dbTab = b.dataset.tab; dbEditId = null; renderFoodPage(); });

  if (dbTab === 'calc') {
    app.querySelectorAll('[data-cname]').forEach(el => {
      el.oninput = () => { calcRows[+el.dataset.cname].name = el.value; };
      el.onchange = () => { calcRows[+el.dataset.cname].name = el.value; renderFoodPage(); };
    });
    app.querySelectorAll('[data-camt]').forEach(el => el.onchange = el.oninput = () => { calcRows[+el.dataset.camt].amount = el.value; renderFoodPage(); });
    app.querySelectorAll('[data-cdel]').forEach(b => b.onclick = () => { calcRows.splice(+b.dataset.cdel, 1); renderFoodPage(); });
    app.querySelector('#calcAdd').onclick = () => { calcRows.push({ name: '', amount: '' }); renderFoodPage(); app.querySelector('.ing-row:last-child input')?.focus(); };
    app.querySelector('#calcServ').oninput = e => { calcServings = e.target.value; };
    app.querySelector('#calcServ').onchange = e => { calcServings = e.target.value; renderFoodPage(); };
    app.querySelector('#calcClear').onclick = () => { calcRows = [{ name: '', amount: '' }]; calcServings = '1'; renderFoodPage(); };
  } else {
    const s = app.querySelector('#dbSearch');
    s.oninput = () => { dbQuery = s.value; const pos = s.selectionStart; renderFoodPage(); const ns = app.querySelector('#dbSearch'); ns.focus(); ns.setSelectionRange(pos, pos); };
    app.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { dbEditId = +b.dataset.edit; renderFoodPage(); });
    app.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
      const id = +b.dataset.del;
      const idx = RAW_FOODS.findIndex(f => f.id === id);
      if (idx < 0) return;
      const removed = RAW_FOODS[idx];
      if (!confirm(`「${removed.name}」をDBから削除しますか？`)) return;
      RAW_FOODS.splice(idx, 1); saveFoods(); renderFoodPage();
      toast(`「${removed.name}」を削除しました`, () => { RAW_FOODS.splice(idx, 0, removed); saveFoods(); renderFoodPage(); });
    });
    app.querySelectorAll('[data-foodform]').forEach(form => {
      const id = form.dataset.foodform === 'new' ? null : +form.dataset.foodform;
      form.querySelector('[data-cancel]')?.addEventListener('click', () => { dbEditId = null; renderFoodPage(); });
      form.querySelector('[data-submit]').onclick = () => {
        const get = n => form.querySelector(`[name=${n}]`).value.trim();
        const item = { name: get('name'), unit: get('unit'), kcal: +toHalf(get('kcal')) || 0, protein: +toHalf(get('protein')) || 0, fat: +toHalf(get('fat')) || 0, carb: +toHalf(get('carb')) || 0, type: 'ingredient' };
        if (!item.name || !item.unit) return toast('材料名と単位は必須です');
        if (id === null) {
          item.id = Math.max(0, ...RAW_FOODS.map(f => +f.id || 0)) + 1;
          RAW_FOODS.push(item);
          toast(`「${item.name}」を追加しました`);
        } else {
          const t = RAW_FOODS.find(f => f.id === id);
          Object.assign(t, item);
          toast(`「${item.name}」を更新しました`);
        }
        dbEditId = null; saveFoods(); renderFoodPage();
      };
    });
    app.querySelector('#dbSave').onclick = () => {
      const blob = new Blob([JSON.stringify(RAW_FOODS, null, 2)], { type: 'application/json' });
      const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: `材料DB_${new Date().toISOString().slice(0, 10)}.json` });
      a.click(); URL.revokeObjectURL(a.href);
      toast('材料DBを書き出しました');
    };
    const dbFile = app.querySelector('#dbFile');
    app.querySelector('#dbLoad').onclick = () => dbFile.click();
    dbFile.onchange = async () => {
      const f = dbFile.files[0]; dbFile.value = '';
      if (!f) return;
      try {
        const json = JSON.parse(await f.text());
        const arr = Array.isArray(json) ? json : json.db ?? json.data;
        if (!Array.isArray(arr) || !arr.every(x => x && x.name && 'kcal' in x)) throw 0;
        if (!confirm(`${arr.length}件の材料で、今のDBを置き換えます。よろしいですか？`)) return;
        const before = RAW_FOODS;
        RAW_FOODS = arr; saveFoods(); renderFoodPage();
        toast('材料DBを読み込みました', () => { RAW_FOODS = before; saveFoods(); renderFoodPage(); });
      } catch { toast('このファイルは読み込めませんでした'); }
    };
    app.querySelector('#dbReset').onclick = () => {
      if (!confirm('最初の210件の状態に戻します。追加・編集した材料は消えます。よろしいですか？')) return;
      const before = RAW_FOODS;
      RAW_FOODS = FOOD_DB.map(f => ({ ...f, type: 'ingredient' })); saveFoods(); renderFoodPage();
      toast('DBを最初の状態に戻しました', () => { RAW_FOODS = before; saveFoods(); renderFoodPage(); });
    };
  }
}

// ---------- day editor ----------
const autoGrow = t => { t.style.height = 'auto'; t.style.height = t.scrollHeight + 2 + 'px'; };

function renderDay(y, m, d) {
  const k = keyOf(y, m, d);
  const date = new Date(y, m - 1, d);
  const entry = migrate(Object.assign(blank(), data[k] ? structuredClone(data[k]) : {}));
  if (!entry.slides?.length) entry.slides = [''];
  const prev = new Date(y, m - 1, d - 1), next = new Date(y, m - 1, d + 1);
  const dayHash = t => `#day/${keyOf(t.getFullYear(), t.getMonth() + 1, t.getDate())}`;
  const hasPrev = inRange(prev.getFullYear(), prev.getMonth() + 1, prev.getDate());
  const hasNext = inRange(next.getFullYear(), next.getMonth() + 1, next.getDate());

  const updateStatus = msg => {
    const st = statusOf(entry);
    const pill = { done: `${entry.format}・${filledSlides(entry)}枚`, draft: '入力途中', none: '未入力' }[st];
    const el = app.querySelector('.status');
    if (el) el.innerHTML = `<span class="pill ${st}">${pill}</span><span>${msg ?? '入力は自動で保存されます'}</span>`;
  };
  const refreshCaption = () => {
    const box = app.querySelector('#captionBox'); if (!box) return;
    const text = buildCaption(entry);
    box.textContent = text;
    const miss = captionMissing(entry);
    const w = app.querySelector('#capWarn');
    w.hidden = !miss.length;
    w.textContent = miss.length ? `未入力：${miss.join('・')}（入力すると自動で反映されます）` : '';
    app.querySelector('#capLen').textContent = `${text.length}文字`;
  };
  // 材料から1人前の栄養素を計算して反映する
  const applyNutrition = () => {
    const res = calcNutrition(entry);
    const note = app.querySelector('#nutNote');
    if (entry.autoNutrition && res.per && res.counted) {
      ['kcal', 'protein', 'fat', 'carb'].forEach(f => {
        entry[f] = String(res.per[f]);
        const el = app.querySelector('#' + f);
        if (el) { el.value = entry[f]; el.readOnly = true; el.style.opacity = .75; }
      });
    } else {
      ['kcal', 'protein', 'fat', 'carb'].forEach(f => {
        const el = app.querySelector('#' + f);
        if (el) { el.readOnly = false; el.style.opacity = 1; }
      });
    }
    if (!note) return;
    if (!entry.autoNutrition) { note.className = 'nut-note'; note.textContent = '自動計算はオフです。数値を直接入力できます。'; return; }
    if (!res.counted) { note.className = 'nut-note warn-note'; note.textContent = '材料名と分量を入力すると自動で計算します。'; return; }
    if (!res.servings) { note.className = 'nut-note warn-note'; note.textContent = '「何人前」を入力すると1人前あたりに換算します。'; return; }
    note.className = 'nut-note' + (res.unknown.length ? ' warn-note' : '');
    note.textContent = `全量 ${Math.round(res.total.kcal)}kcal ÷ ${res.servings}人前 ＝ 1人前 ${res.per.kcal}kcal`
      + (res.unknown.length ? `／計算に含めていない材料：${res.unknown.join('・')}` : '');
  };

  const refreshShoot = () => {
    const el = app.querySelector('#shootInfo'); if (!el) return;
    const here = shootsOn(k).map(sh => `<a href="#day/${sh.post}">📷 この日は「${esc(sh.recipe)}」の撮影日（${mdLabel(sh.post)}投稿）→ レシピを開く</a>`);
    const shootKey = shootKeyOf(k);
    const mine = txt(entry.recipe) ? [inRange(...shootKey.split('-').map(Number))
      ? `<a href="#day/${shootKey}">📷 撮影日：${mdLabel(shootKey)}（投稿の${SHOOT_BEFORE}日前）</a>`
      : `<span>📷 撮影日：${mdLabel(shootKey)}（投稿の${SHOOT_BEFORE}日前）</span>`] : [];
    el.innerHTML = [...mine, ...here].join('');
    el.hidden = !el.innerHTML;
  };

  const commit = () => {
    applyNutrition();
    if (statusOf(entry) !== 'none') data[k] = structuredClone(entry); else delete data[k];
    if (save()) updateStatus(`保存済み ${new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })}`);
    refreshCaption();
    refreshShoot();
  };

  const num = (id, label, unit, ph = '') => `
    <div class="field"><label for="${id}">${label}</label>
      <div class="unit"><input type="number" inputmode="decimal" id="${id}" value="${esc(entry[id])}" placeholder="${ph}" min="0"><span class="u">${unit}</span></div>
    </div>`;

          <a class="btn" ${hasPrev ? `href="${dayHash(prev)}"` : 'aria-disabled="true" style="opacity:.35;pointer-events:none"'} aria-label="前の日">← 前日</a>
          <a class="btn" ${hasNext ? `href="${dayHash(next)}"` : 'aria-disabled="true" style="opacity:.35;pointer-events:none"'} aria-label="次の日">翌日 →</a>
        </div>
        <div class="status"></div>
        <div class="shoot-info" id="shootInfo" hidden></div>
        <div class="day-tools">
          <button class="btn" id="moveBtn">🔁 他の日にコピー／入れ替え</button>
          <button class="btn" id="resetBtn">🧹 この日をリセット</button>
        </div>

        <div class="section">
          <div class="fields" style="grid-template-columns:2fr 1fr">
            <div class="field"><label for="recipe">🍳 レシピ名</label>
              <input type="text" id="recipe" value="${esc(entry.recipe)}" placeholder="例：鶏むねのやみつきレモン南蛮"></div>
            <div class="field"><label for="format">📣 投稿形態</label>
              <select id="format">${FORMATS.map(f => `<option ${entry.format === f ? 'selected' : ''}>${f}</option>`).join('')}</select></div>
          </div>
        </div>

        <div class="section">
          <h3>🍽 レシピの基本情報</h3>
          <div class="fields">
            ${num('servings', '何人前', '人前', '2')}
            ${num('time', '調理時間', '分', '15')}
          </div>
        </div>

        <div class="section">
          <label class="lbl">🧂 材料 <small>材料名を選ぶと栄養成分を自動計算します</small></label>
          <div class="ing-head"><span>材料名</span><span>分量</span><span>単位</span><span></span></div>
          <div id="ingRows"></div>
          <button class="add" id="addIng" style="min-height:48px">＋ 材料を追加</button>
        </div>

        <div class="section">
          <h3>🥗 栄養成分（1人前）</h3>
          <label class="switch"><input type="checkbox" id="autoNut" ${entry.autoNutrition ? 'checked' : ''}><span>材料から自動計算する</span></label>
          <div id="nutNote" class="nut-note"></div>
          <div class="fields">
            ${num('kcal', 'カロリー', 'kcal', '320')}
            ${num('protein', 'タンパク質', 'g', '32')}
            ${num('fat', '脂質', 'g', '8')}
            ${num('carb', '糖質', 'g', '20')}
          </div>

        <div class="section">
          <label class="lbl" for="steps">👨‍🍳 作り方 <small>1行に1工程</small></label>
          <textarea id="steps" rows="4" placeholder="①鶏むね肉をそぎ切りにする&#10;②片栗粉をまぶして焼く&#10;③タレを絡めて完成">${esc(entry.steps)}</textarea>
        </div>

        <div class="section">
          <label class="lbl">🔗 競合の参考動画 <small>${entry.refUrls.filter(u => txt(u)).length} / ${REF_COUNT}件</small></label>

                <span class="ref-no">${i + 1}</span>
                <input type="url" inputmode="url" data-ref="${i}" value="${esc(u)}" placeholder="https://www.instagram.com/reel/..." aria-label="参考動画${i + 1}のURL">
                <a class="btn ref-open" data-refopen="${i}" target="_blank" rel="noopener noreferrer" ${safeUrl(u) ? `href="${esc(safeUrl(u))}"` : 'aria-disabled="true"'}>開く ↗</a>
              </div>`).join('')}
          </div>
        </div>

        <div class="section">
          <label class="lbl">📱 投稿の内容 <small>${n} / ${MAX_SLIDES}枚</small></label>
          <div class="slides">
            ${entry.slides.map((s, i) => `
              <div class="slide">
                <div class="no" aria-hidden="true"><b>${i + 1}</b><span>枚目</span></div>
                <div>
                  <textarea data-i="${i}" rows="3" aria-label="${i + 1}枚目の内容" placeholder="${i === 0 ? '例：表紙＝完成写真／テキスト「レンジで15分」' : `${i + 1}枚目の内容`}">${esc(s)}</textarea>
                  <div class="tools">
                    <span class="count">${s.length}文字</span>
                    <span style="display:flex;gap:6px">
                      <button class="mini" data-up="${i}" aria-label="${i + 1}枚目を上へ" ${i === 0 ? 'disabled' : ''}>↑</button>
                      <button class="mini" data-down="${i}" aria-label="${i + 1}枚目を下へ" ${i === n - 1 ? 'disabled' : ''}>↓</button>
                      <button class="mini" data-dup="${i}" aria-label="${i + 1}枚目を複製" ${n >= MAX_SLIDES ? 'disabled' : ''}>複製</button>
                      <button class="mini danger" data-del="${i}" aria-label="${i + 1}枚目を削除" ${n === 1 ? 'disabled' : ''}>削除</button>
                    </span>
                  </div>
                </div>
              </div>`).join('')}
          </div>
          <button class="add" id="addBtn" ${n >= MAX_SLIDES ? 'disabled' : ''}>
            ${n >= MAX_SLIDES ? '上限の30枚に達しました' : `＋ ページを追加（${n + 1}枚目）`}
          </button>
        </div>

        <div class="section">
          <label class="lbl" for="caption1">✍️ キャプション内容① <small>レシピ紹介の本文</small></label>
          <textarea id="caption1" rows="4" placeholder="例：揚げずに作れるから罪悪感ゼロ！&#10;冷めても美味しいのでお弁当にもおすすめです🍱">${esc(entry.caption1)}</textarea>
        </div>

        <div class="section">
          <label class="lbl">📋 キャプション（自動生成） <small id="capLen"></small></label>
          <div class="warn" id="capWarn" hidden></div>
          <div class="caption-box" id="captionBox"></div>
          <div class="caption-actions">
            <button class="btn accent" id="copyCap">📋 コピー</button>
            <button class="btn" id="dlCap">⬇ テキストで保存</button>
          </div>
        </div>
      </section>`;

    updateStatus();
    refreshShoot();
    applyNutrition();
    refreshCaption();
    app.querySelectorAll('textarea').forEach(autoGrow);

    const bind = (id, grow) => {
      const el = app.querySelector('#' + id);
      el.oninput = () => { entry[id] = el.value; if (grow) autoGrow(el); commit(); };
    };
    ['recipe', 'servings', 'time', 'kcal', 'protein', 'fat', 'carb'].forEach(id => bind(id));
    ['steps', 'caption1'].forEach(id => bind(id, true));

    app.querySelectorAll('[data-ref]').forEach(el => el.oninput = () => {
      const i = +el.dataset.ref;
      entry.refUrls[i] = el.value;
      const a = app.querySelector(`[data-refopen="${i}"]`);
      const url = safeUrl(el.value);
      if (url) { a.href = url; a.removeAttribute('aria-disabled'); } else { a.removeAttribute('href'); a.setAttribute('aria-disabled', 'true'); }
      const cnt = el.closest('.section').querySelector('.lbl small');
      cnt.textContent = `${entry.refUrls.filter(u => txt(u)).length} / ${REF_COUNT}件`;
      commit();
    });

    // 材料の行
    const ingWrap = app.querySelector('#ingRows');
    const drawRows = () => {
      ingWrap.innerHTML = entry.ingredientRows.map((r, i) => {
        const food = findFood(r.name);
        const unit = txt(r.unit) || food?.label || '';
        return `<div class="ing-row">
          <input type="text" list="foodList" data-ing="${i}" value="${esc(r.name)}" placeholder="材料名（例：鶏むね肉）" aria-label="${i + 1}番目の材料名">
          <input type="text" inputmode="decimal" data-amt="${i}" value="${esc(r.amount)}" placeholder="300" aria-label="${i + 1}番目の分量">
          <span class="ing-unit ${food ? '' : 'miss'}">${esc(unit || '—')}${food ? '' : ' 未登録'}</span>
          <button class="mini danger" data-ingdel="${i}" aria-label="${i + 1}番目の材料を削除" ${entry.ingredientRows.length === 1 ? 'disabled' : ''}>×</button>
        </div>`;
      }).join('');
      ingWrap.querySelectorAll('[data-ing]').forEach(el => {
        el.oninput = () => { entry.ingredientRows[+el.dataset.ing].name = el.value; commit(); };
        el.onchange = () => { entry.ingredientRows[+el.dataset.ing].name = el.value; commit(); drawRows(); };
      });
      ingWrap.querySelectorAll('[data-amt]').forEach(el => el.oninput = () => { entry.ingredientRows[+el.dataset.amt].amount = el.value; commit(); });
      ingWrap.querySelectorAll('[data-ingdel]').forEach(b => b.onclick = () => {
        const i = +b.dataset.ingdel;
        const removed = entry.ingredientRows.splice(i, 1)[0];
        commit(); drawRows();
        toast(`${rowName(removed) || '材料'}を削除しました`, () => { entry.ingredientRows.splice(i, 0, removed); commit(); drawRows(); });
      });
    };
    drawRows();
    app.querySelector('#addIng').onclick = () => {
      entry.ingredientRows.push({ name: '', amount: '' }); commit(); drawRows();
      ingWrap.querySelector('.ing-row:last-child input')?.focus();
    };
    app.querySelector('#autoNut').onchange = e => { entry.autoNutrition = e.target.checked; commit(); };

    app.querySelector('#resetBtn').onclick = () => {
      if (statusOf(entry) === 'none') return toast('この日はまだ何も入力されていません');
      if (!confirm(`${m}月${d}日の入力内容をすべて消します。よろしいですか？`)) return;
      const before = structuredClone(entry);
      Object.assign(entry, blank());
      commit(); draw();
      toast('入力内容をリセットしました', () => { Object.assign(entry, before); commit(); draw(); });
    };
    app.querySelector('#moveBtn').onclick = () => openTransfer(k);
    app.querySelector('#format').onchange = e => { entry.format = e.target.value; commit(); };

    app.querySelectorAll('textarea[data-i]').forEach(t => t.oninput = () => {
      entry.slides[+t.dataset.i] = t.value; autoGrow(t);
      t.closest('.slide').querySelector('.count').textContent = `${t.value.length}文字`;
      commit();
    });
    const add = (at, text = '') => { if (entry.slides.length >= MAX_SLIDES) return; entry.slides.splice(at, 0, text); commit(); draw(at); };
    app.querySelector('#addBtn').onclick = () => add(entry.slides.length);
    const move = (a, b) => { [entry.slides[a], entry.slides[b]] = [entry.slides[b], entry.slides[a]]; commit(); draw(b); };
    app.querySelectorAll('[data-up]').forEach(b => b.onclick = () => move(+b.dataset.up, +b.dataset.up - 1));
    app.querySelectorAll('[data-down]').forEach(b => b.onclick = () => move(+b.dataset.down, +b.dataset.down + 1));
    app.querySelectorAll('[data-dup]').forEach(b => b.onclick = () => add(+b.dataset.dup + 1, entry.slides[+b.dataset.dup]));
    app.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
      const i = +b.dataset.del;
      const removed = entry.slides.splice(i, 1)[0];
      commit(); draw(Math.max(0, i - 1));
      toast(`${i + 1}枚目を削除しました`, () => { entry.slides.splice(i, 0, removed); commit(); draw(i); });
    });

    app.querySelector('#copyCap').onclick = async () => {
      const text = buildCaption(entry);
      try { await navigator.clipboard.writeText(text); toast('キャプションをコピーしました'); }
      catch {
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove(); toast('キャプションをコピーしました');
      }
    };
    app.querySelector('#dlCap').onclick = () => {
      const name = (txt(entry.recipe) || '投稿').replace(/[\\/:*?"<>|]/g, '_');
      const blob = new Blob(['﻿' + buildCaption(entry)], { type: 'text/plain;charset=utf-8' });
      const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: `${y}${pad(m)}${pad(d)}_${name}_キャプション.txt` });
      a.click(); URL.revokeObjectURL(a.href);
      toast('テキストで保存しました');
    };

    if (focusIndex !== undefined) {
      const t = app.querySelectorAll('textarea[data-i]')[focusIndex];
      t?.focus({ preventScroll: true }); t?.closest('.slide').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  };
  draw();
  if (statusOf(entry) === 'none') app.querySelector('#recipe').focus();
}


// ---------- コピー／入れ替え／移動 ----------
const moveDlg = document.getElementById('moveDlg');
const mvDate = document.getElementById('mvDate');
const mvInfo = document.getElementById('mvInfo');
let mvFromKey = null;
const dayTitle = key => { const [y, m, d] = key.split('-').map(Number); return `${y}年${m}月${d}日（${DOW[new Date(y, m - 1, d).getDay()]}）`; };
const summaryOf = key => {
  const e = data[key];
  return statusOf(e) === 'none' ? '未入力' : `${e.format}・${txt(e.recipe) || 'レシピ名なし'}`;
};
function openTransfer(fromKey) {
  mvFromKey = fromKey;
  document.getElementById('mvFrom').textContent = `${dayTitle(fromKey)}：${summaryOf(fromKey)}`;
  mvDate.min = `${MIN.y}-${pad(MIN.m)}-01`;
  mvDate.max = `${MAX.y}-${pad(MAX.m)}-${new Date(MAX.y, MAX.m, 0).getDate()}`;
  mvDate.value = '';
  mvInfo.textContent = '相手の日付を選んでください';
  moveDlg.showModal();
}
mvDate.onchange = () => {
  const k = mvDate.value;
  mvInfo.className = 'nut-note';
  if (!k) return mvInfo.textContent = '相手の日付を選んでください';
  if (k === mvFromKey) { mvInfo.className = 'nut-note warn-note'; return mvInfo.textContent = '同じ日は選べません'; }
  const filled = statusOf(data[k]) !== 'none';
  if (filled) mvInfo.className = 'nut-note warn-note';
  mvInfo.textContent = `${dayTitle(k)}：${summaryOf(k)}${filled ? '（コピー・移動を選ぶと上書きされます）' : ''}`;
};
document.getElementById('mvOk').onclick = () => {
  const to = mvDate.value;
  if (!to || to === mvFromKey) { mvInfo.className = 'nut-note warn-note'; mvInfo.textContent = '相手の日付を選んでください'; return; }
  const op = moveDlg.querySelector('input[name=mvop]:checked').value;
  const before = structuredClone(data);
  const from = mvFromKey;
  const a = data[from] ? structuredClone(data[from]) : null;
  const b = data[to] ? structuredClone(data[to]) : null;
  const set = (key, val) => { if (val) data[key] = val; else delete data[key]; };
  if (op === 'copy') set(to, a);
  if (op === 'move') { set(to, a); delete data[from]; }
  if (op === 'swap') { set(to, a); set(from, b); }
  save(); moveDlg.close();
  location.hash = `day/${op === 'copy' ? from : to}`;
  route();
  const label = { copy: 'コピー', move: '移動', swap: '入れ替え' }[op];
  toast(`${dayTitle(to)}へ${label}しました`, () => { data = before; save(); location.hash = `day/${from}`; route(); });
};

// ---------- dialogs ----------
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => b.closest('dialog').close());
document.querySelectorAll('dialog').forEach(dl => dl.addEventListener('click', e => { if (e.target === dl) dl.close(); }));

const exportDlg = document.getElementById('exportDlg');
const exportKeys = range => {
  const prefix = `${view.y}-${pad(view.m)}`;
  return Object.keys(data).filter(k => statusOf(data[k]) !== 'none' && (range === 'all' || k.startsWith(prefix))).sort();
};
document.getElementById('exportBtn').onclick = () => {
  const mc = exportKeys('month').length, ac = exportKeys('all').length;
  document.getElementById('exMonthLbl').textContent = `${view.y}年${view.m}月だけ`;
  document.getElementById('exMonthCnt').textContent = `${mc}日分`;
  document.getElementById('exAllCnt').textContent = `${ac}日分`;
  if (!mc && ac) exportDlg.querySelector('input[value=all]').checked = true;
  document.getElementById('dlgOk').disabled = !ac;
  exportDlg.showModal();
};
document.getElementById('dlgOk').onclick = () => {
  const range = exportDlg.querySelector('input[name=range]:checked').value;
  if (!window.XLSX) return toast('Excel出力にはインターネット接続が必要です');
  const keys = exportKeys(range);
  if (!keys.length) return toast('この範囲には入力内容がありません');
  exportDlg.close();

  const maxSlides = Math.max(...keys.map(k => data[k].slides?.length ?? 1));
  const header = ['日付', '曜日', '撮影日', '状態', 'レシピ名', '投稿形態', '何人前', '調理時間(分)',
    'カロリー(kcal)', 'タンパク質(g)', '脂質(g)', '糖質(g)', '材料', '作り方', 'キャプション内容①', 'キャプション全文', '参考動画URL', '枚数',
    ...Array.from({ length: maxSlides }, (_, i) => `${i + 1}枚目`)];
  const rows = keys.map(k => {
    const [yy, mm, dd] = k.split('-').map(Number);
    const e = migrate(Object.assign(blank(), data[k]));
    return [`${yy}/${pad(mm)}/${pad(dd)}`, DOW[new Date(yy, mm - 1, dd).getDay()], txt(e.recipe) ? shootKeyOf(k).replace(/-/g, '/') : '',
      statusOf(e) === 'done' ? '投稿決定' : '入力途中', e.recipe, e.format, e.servings, e.time,
      e.kcal, e.protein, e.fat, e.carb, ingredientText(e) || e.ingredients, e.steps, e.caption1, buildCaption(e), (e.refUrls ?? []).filter(u => txt(u)).join(String.fromCharCode(10)), filledSlides(e), ...e.slides];
  });
  const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
  ws['!cols'] = [{ wch: 12 }, { wch: 5 }, { wch: 12 }, { wch: 9 }, { wch: 26 }, { wch: 9 }, { wch: 7 }, { wch: 10 },
    { wch: 12 }, { wch: 12 }, { wch: 9 }, { wch: 9 }, { wch: 34 }, { wch: 34 }, { wch: 30 }, { wch: 46 }, { wch: 40 }, { wch: 6 },
    ...Array(maxSlides).fill({ wch: 30 })];
  ws['!autofilter'] = { ref: ws['!ref'] };
  ws['!freeze'] = { xSplit: 1, ySplit: 1 };
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '投稿スケジュール');
  XLSX.writeFile(wb, range === 'all' ? `${settings.appName}_全期間.xlsx` : `${settings.appName}_${view.y}年${view.m}月.xlsx`);
  toast(`${keys.length}日分を出力しました`);
};

const setDlg = document.getElementById('setDlg');
const stName = document.getElementById('stName'), stLead = document.getElementById('stLead'), stFooter = document.getElementById('stFooter');
document.getElementById('setBtn').onclick = () => {
  stName.value = settings.appName; stLead.value = settings.lead; stFooter.value = settings.footer;
  setDlg.showModal();
};
document.getElementById('stReset').onclick = () => { stName.value = DEFAULT_SETTINGS.appName; stLead.value = DEFAULT_SETTINGS.lead; stFooter.value = DEFAULT_SETTINGS.footer; };
document.getElementById('stOk').onclick = () => {
  settings = { appName: stName.value.trim() || DEFAULT_SETTINGS.appName, lead: stLead.value, footer: stFooter.value };
  saveSettings(); setDlg.close(); route();
  toast('設定を保存しました');
};

const backupDlg = document.getElementById('backupDlg');
document.getElementById('backupBtn').onclick = () => backupDlg.showModal();
document.getElementById('bkSave').onclick = () => {
  const blob = new Blob([JSON.stringify({ app: KEY, savedAt: new Date().toISOString(), data }, null, 2)], { type: 'application/json' });
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: `${settings.appName}_バックアップ_${new Date().toISOString().slice(0, 10)}.json` });
  a.click(); URL.revokeObjectURL(a.href);
  toast('バックアップを保存しました');
};
const bkFile = document.getElementById('bkFile');
document.getElementById('bkLoad').onclick = () => bkFile.click();
bkFile.onchange = async () => {
  const f = bkFile.files[0]; bkFile.value = '';
  if (!f) return;
  try {
    const json = JSON.parse(await f.text());
    const incoming = json.data ?? json;
    if (typeof incoming !== 'object' || !Object.keys(incoming).every(k => /^\d{4}-\d{2}-\d{2}$/.test(k))) throw 0;
    if (!confirm(`${Object.keys(incoming).length}日分のデータで、今の内容を置き換えます。よろしいですか？`)) return;
    const before = data;
    data = incoming; save(); backupDlg.close(); route();
    toast('復元しました', () => { data = before; save(); route(); });
  } catch { toast('このファイルは読み込めませんでした'); }
};

saveSettings();
loadFoods();
route();
</script>
</body>
</html>
